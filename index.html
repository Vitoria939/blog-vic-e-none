<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Meu Cantinho Tech — IA Blog</title>
  <style>
    /* Reset Geral e Fontes Fofas */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      line-height: 1.6;
      color: #4a4a4a;
      background-color: #fff0f5;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      background: rgba(255, 245, 247, 0.9);
      backdrop-filter: blur(8px);
      padding: 35px 0;
      text-align: center;
      border-bottom: 2px dashed #ffb6c1;
    }

    header h1 {
      font-size: 2.3rem;
      color: #ff6b8b;
      letter-spacing: -0.5px;
    }

    .subtitulo {
      color: #a38087;
      font-size: 1rem;
      margin-top: 6px;
      font-style: italic;
    }

    nav {
      background: #ffb6c1;
      padding: 10px 0;
      box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3);
    }

    nav .container {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 6px 16px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    nav a:hover,
    nav a.ativo {
      background: #ff6b8b;
      transform: translateY(-1px);
    }

    .container-flex {
      display: flex;
      flex-wrap: wrap;
      margin-top: 35px;
      margin-bottom: 60px;
      gap: 25px;
    }

    .conteudo-principal {
      flex: 2.3;
      min-width: 320px;
    }

    .barra-lateral {
      flex: 1;
      min-width: 300px;
      height: fit-content;
    }

    .post,
    .barra-lateral {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid rgba(255, 182, 193, 0.4);
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 107, 139, 0.06);
    }

    .post h2 {
      color: #ff6b8b;
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    .meta-dados {
      font-size: 0.8rem;
      color: #b388ff;
      background: #f3e5f5;
      padding: 5px 14px;
      display: inline-block;
      border-radius: 30px;
      margin-bottom: 22px;
      font-weight: 600;
    }

    #texto-post {
      font-size: 1.05rem;
      color: #555;
    }

    .barra-lateral h3 {
      color: #ff6b8b;
      margin-bottom: 20px;
      font-size: 1.3rem;
      text-align: center;
    }

    .campo-form {
      margin-bottom: 18px;
    }

    .campo-form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #7d666a;
    }

    .campo-form input,
    .campo-form textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ffe4e1;
      border-radius: 12px;
      font-size: 0.95rem;
      background: #fffafa;
      color: #4a4a4a;
      transition: all 0.3s ease;
    }

    .campo-form input:focus,
    .campo-form textarea:focus {
      outline: none;
      border-color: #ff6b8b;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 107, 139, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 154, 158, 0.6);
    }

    .carregando {
      color: #ff6b8b;
      font-weight: 500;
      animation: piscar 1.5s infinite ease-in-out;
    }

    @keyframes piscar {
      0% {
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0.5;
      }
    }
  </style>
  <!-- Script do Marked para renderizar o Markdown da IA -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <header>
    <div class="container">
      <h1> Meu Blog Inteligente</h1>
      <p class="subtitulo">Criado com amor, código e Inteligência Artificial</p>
    </div>
  </header>

  <nav>
    <div class="container">
      <a href="#" class="ativo">Home</a>
      <a href="https://www.linkedin.com/in/vit%C3%B3ria-wasem-276499312/" target="_blank">LinkedIn</a>
      <a href="https://github.com/Vitoria939?tab=repositories" target="_blank">GitHub</a>
    </div>
  </nav>

  <main class="container container-flex">
    <section class="conteudo-principal">
      <article class="post">
        <h2>✨ Resposta da nossa IA</h2>
        <div class="meta-dados">🔮 Conectado em tempo real via n8n Webhook</div>
        <div id="texto-post">
          <p>Mande um bilhetinho no formulário ao lado para ver a mágica acontecer aqui!</p>
        </div>
      </article>
    </section>

    <aside class="barra-lateral">
      <h3>Fale com a IA</h3>

      <form id="meu-form">
        <div class="campo-form">
          <label for="email">Seu e-mail favorito:</label>
          <input type="email" id="email" placeholder="exemplo@dominio.com" required>
        </div>
        <div class="campo-form">
          <label for="message">Sua mensagem ou pergunta:</label>
          <textarea id="message" rows="5" placeholder="O que você quer perguntar para a IA hoje? " required></textarea>
        </div>
        <button type="submit">Enviar Recadinho ✨</button>
      </form>
    </aside>
  </main>

  <script>
    const form = document.getElementById('meu-form');
    const textoPost = document.getElementById('texto-post');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      textoPost.innerHTML = "<p class='carregando'>🤖 Guardando seus dados e pensando... Aguarde um tiquinho ✨</p>";

      try {
        const response = await fetch('https://vic939.app.n8n.cloud/webhook/d765bc00-a83d-46c3-9b99-37b708599497', {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        if (!response.ok) {
          throw new Error(`Resposta inválida do servidor: ${response.status}`);
        }

        const text = await response.text();
        textoPost.innerHTML = marked.parse(text);
      } catch (error) {
        textoPost.innerHTML = "<p style='color: #ff7675;'>❌ Ops! Algo deu errado ao falar com a IA. Tenta de novo? 💖</p>";
      }
    });
  </script>
</body>

</html>
